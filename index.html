<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Aos 64 anos, um ano depois de operar um câncer de próstata, corri 64 km. Agora vem a primeira maratona. Run with Gratitude.">
<meta property="og:title" content="Run with Gratitude">
<meta property="og:description" content="64 anos. 64 km. E agora a primeira maratona.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://runwithgratitude.ca">
<title>Run with Gratitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e100f; --bg2:#161917; --linha:#242825;
  --tx:#eceee9; --tx2:#a3a9a1; --tx3:#6f766d;
  --acc:#c9a227; --acc2:#7fa650;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:660px;margin:0 auto;padding:0 22px}
a{color:inherit}

header{border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:10;
  background:rgba(14,16,15,.88);backdrop-filter:blur(12px)}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
.marca{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em;
  text-decoration:none;flex:1}
.marca i{color:var(--acc);font-style:normal}
.idioma{display:flex;border:1px solid var(--linha);border-radius:20px;overflow:hidden}
.idioma button{background:none;border:0;color:var(--tx3);font-family:var(--sans);
  font-size:11.5px;font-weight:600;padding:6px 12px;cursor:pointer;letter-spacing:.04em}
.idioma button.on{background:var(--acc);color:#161917}

.hero{padding:52px 0 40px;border-bottom:1px solid var(--linha)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,7vw,46px);
  line-height:1.15;margin:0 0 18px;letter-spacing:-.02em}
.hero h1 b{font-weight:600;color:var(--acc)}
.hero p{color:var(--tx2);font-size:16px;margin:0 0 26px;max-width:52ch}
.conta{display:flex;align-items:baseline;gap:12px;padding:16px 18px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--linha)}
.conta b{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--acc2);line-height:1}
.conta span{font-size:13px;color:var(--tx2);line-height:1.45}

main{padding:38px 0 60px}
.vazio{color:var(--tx3);font-size:15px;text-align:center;padding:60px 0;font-style:italic}
article{padding:30px 0;border-bottom:1px solid var(--linha)}
article:last-child{border-bottom:0}
.data{font-size:11.5px;color:var(--tx3);letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;margin-bottom:9px}
article h2{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.25;
  margin:0 0 10px;letter-spacing:-.01em}
.corpo{color:var(--tx2);font-size:16.5px;line-height:1.75}
.corpo p{margin:0 0 15px}
.corpo p:last-child{margin-bottom:0}
.corpo b{color:var(--tx);font-weight:600}
.resumo{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.resumo span{font-size:11.5px;color:var(--tx2);background:var(--bg2);
  border:1px solid var(--linha);border-radius:20px;padding:4px 11px;font-variant-numeric:tabular-nums}
#evo{padding:34px 0;border-bottom:1px solid var(--linha)}
#evo h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
#evo .desde{font-size:12.5px;color:var(--tx3);margin-bottom:20px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin-bottom:24px}
.nums div{background:var(--bg2);border:1px solid var(--linha);border-radius:11px;padding:13px 12px}
.nums b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;color:var(--acc2);
  line-height:1.1;font-variant-numeric:tabular-nums}
.nums span{font-size:11px;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.barras{display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:7px}
.barras i{flex:1;background:var(--acc2);border-radius:3px 3px 0 0;min-height:2px;opacity:.85;
  position:relative;transition:opacity .15s}
.barras i:hover{opacity:1}
.barras i.zero{background:var(--linha)}
.eixo{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx3);
  font-variant-numeric:tabular-nums}
.legenda{font-size:12.5px;color:var(--tx2);margin-top:14px;line-height:1.6}
.legenda b{color:var(--tx)}
.midia{margin:16px 0 4px;display:grid;gap:9px}
.midia img{width:100%;border-radius:11px;display:block;background:var(--bg2);cursor:zoom-in}
.midia .duas{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.video{position:relative;width:100%;padding-top:56.25%;border-radius:11px;overflow:hidden;
  background:var(--bg2);margin:16px 0 4px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lupa{position:fixed;inset:0;background:rgba(8,9,8,.94);z-index:99;display:none;
  align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lupa.on{display:flex}
.lupa img{max-width:100%;max-height:100%;border-radius:8px}
.mais{background:none;border:0;color:var(--acc);font-family:var(--sans);font-size:13.5px;
  font-weight:600;cursor:pointer;padding:8px 0;margin-top:6px}
footer{border-top:1px solid var(--linha);padding:30px 0 46px;color:var(--tx3);font-size:12.5px}
footer p{margin:0 0 8px}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="marca" href="/">Run with <i>Gratitude</i></a>
  <div class="idioma">
    <button data-l="pt" class="on">PT</button><button data-l="en">EN</button>
  </div>
</div></header>

<section class="hero"><div class="wrap">
  <h1 id="hTit"></h1>
  <p id="hSub"></p>
  <div class="conta"><b id="cDias">—</b><span id="cTxt"></span></div>
</div></section>

<section id="evo" style="display:none"><div class="wrap" id="evoIn"></div></section>

<main><div class="wrap" id="posts"></div></main>
<div class="lupa" id="lupa"><img alt=""></div>

<footer><div class="wrap">
  <p id="fTxt"></p>
  <p>© <span id="ano"></span> Luiz Silva · Saint John, New Brunswick</p>
</div></footer>

<script>
const DB   = 'https://gastos-casa-7f431-default-rtdb.firebaseio.com';
const PROVA = '2026-10-18';

const T = {
  pt:{
    evoT:'A caminhada desde a cirurgia',
    evoD:'Números de corrida desde 13 de junho de 2025. Atualizados sozinhos, direto do relógio.',
    nKm:'km corridos', nTr:'treinos', nDias:'dias', nVo2:'VO₂max', nLongo:'maior longo',
    evoL:'Cada barra é um mês. A altura é a quilometragem; o número embaixo, o ritmo médio daquele mês.',
    tit:'Aos 64 anos, correndo com <b>gratidão</b>.',
    sub:'Em junho de 2025 operei um câncer de próstata. Um ano depois, no mesmo dia, corri 64 km — um para cada ano de vida. Agora vem a primeira maratona da minha vida, e um índice para Boston.',
    ctxt:'dias para a PEI Marathon,<br>18 de outubro de 2026',
    hoje:'É hoje. PEI Marathon.',
    passou:'A PEI Marathon já passou.',
    vazio:'Os primeiros textos chegam em breve.',
    mais:'Continuar lendo',
    menos:'Recolher',
    rodape:'Um diário de treino e de vida, escrito no caminho até 18 de outubro.'
  },
  en:{
    evoT:'The road back since surgery',
    evoD:'Running numbers since June 13, 2025. Updated automatically, straight from the watch.',
    nKm:'km run', nTr:'sessions', nDias:'days', nVo2:'VO₂max', nLongo:'longest run',
    evoL:'Each bar is a month. Height is distance; the number below is that month\'s average pace.',
    tit:'At 64, running with <b>gratitude</b>.',
    sub:'In June 2025 I had surgery for prostate cancer. One year later, to the day, I ran 64 km — one for every year of my life. Now comes the first marathon of my life, and a Boston qualifying time.',
    ctxt:'days to the PEI Marathon,<br>October 18, 2026',
    hoje:'Today is the day. PEI Marathon.',
    passou:'The PEI Marathon has passed.',
    vazio:'The first posts are coming soon.',
    mais:'Keep reading',
    menos:'Collapse',
    rodape:'A training and life journal, written on the way to October 18.'
  }
};
const MES = {
  pt:['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],
  en:['January','February','March','April','May','June','July','August','September','October','November','December']
};

let idioma = (localStorage.getItem('rwg.lang')
  || (navigator.language||'pt').slice(0,2).toLowerCase());
if(idioma !== 'en') idioma = 'pt';
let POSTS = [];
const abertos = new Set();

const esc = t => String(t==null?'':t)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* parágrafos por linha em branco, **negrito** por asteriscos duplos */
function texto(t){
  return esc(t).trim().split(/\n\s*\n/)
    .map(p => '<p>' + p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>') + '</p>')
    .join('');
}
function dataLonga(iso){
  const d = new Date(iso + 'T12:00:00');
  return idioma === 'pt'
    ? d.getDate() + ' de ' + MES.pt[d.getMonth()] + ' de ' + d.getFullYear()
    : MES.en[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

let EVO = null;

function pintarEvolucao(){
  if(!EVO || !EVO.meses) return;
  const t = T[idioma];
  const meses = Object.keys(EVO.meses).sort();
  const kms = meses.map(function(m){ return EVO.meses[m].km || 0 });
  const topo = Math.max.apply(null, kms) || 1;
  const pace = s => s ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : '—';

  const rot = function(m){
    const d = new Date(m + '-01T12:00:00');
    return (idioma === 'pt' ? MES.pt : MES.en)[d.getMonth()].slice(0,3) + ' ' + String(d.getFullYear()).slice(2);
  };
  const ult = EVO.meses[meses[meses.length-1]] || {};

  document.getElementById('evoIn').innerHTML =
      '<h3>' + t.evoT + '</h3>'
    + '<div class="desde">' + t.evoD + '</div>'
    + '<div class="nums">'
    +   '<div><b>' + Math.round(EVO.km).toLocaleString(idioma === 'pt' ? 'pt-BR' : 'en-CA') + '</b><span>' + t.nKm + '</span></div>'
    +   '<div><b>' + EVO.treinos + '</b><span>' + t.nTr + '</span></div>'
    +   '<div><b>' + EVO.dias + '</b><span>' + t.nDias + '</span></div>'
    +   (EVO.vo2max ? '<div><b>' + EVO.vo2max + '</b><span>' + t.nVo2 + '</span></div>' : '')
    +   (EVO.maiorLongo ? '<div><b>' + Math.round(EVO.maiorLongo) + '</b><span>' + t.nLongo + '</span></div>' : '')
    + '</div>'
    + '<div class="barras">' + meses.map(function(m, i){
        const k = kms[i];
        const p = EVO.meses[m].pace;
        return '<i class="' + (k ? '' : 'zero') + '" style="height:' + Math.max(2, k/topo*100)
             + '%" title="' + rot(m) + ' · ' + k.toFixed(1) + ' km'
             + (p ? ' · ' + pace(p) + '/km' : '') + '"></i>';
      }).join('') + '</div>'
    + '<div class="eixo"><span>' + rot(meses[0]) + '</span><span>'
    +   rot(meses[meses.length-1]) + '</span></div>'
    + '<div class="legenda">' + t.evoL
    + (ult.pace ? '<br><b>' + rot(meses[meses.length-1]) + '</b>: ' + (ult.km||0).toFixed(1)
                + ' km · ' + pace(ult.pace) + '/km' : '') + '</div>';
  document.getElementById('evo').style.display = 'block';
}

/* YouTube e Vimeo por link colado; qualquer outro endereço vira link simples */
function embutir(url){
  if(!url) return '';
  const u = String(url).trim();
  let id = '', src = '';
  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/);
  if(m){ id = m[1]; src = 'https://www.youtube-nocookie.com/embed/' + id }
  if(!src){ m = u.match(/vimeo\.com\/(\d+)/); if(m) src = 'https://player.vimeo.com/video/' + m[1] }
  if(!src) return '<p style="margin:14px 0 0"><a href="' + esc(u) + '" style="color:var(--acc)">'
                + esc(u) + '</a></p>';
  return '<div class="video"><iframe src="' + src + '" loading="lazy" allowfullscreen '
       + 'referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
}

/* As fotos ficam num nó à parte e só descem quando o texto aparece na tela.
   Se viessem junto com a lista, a página inicial pesaria megabytes. */
const fotosVistas = {};
function carregarFotos(){
  document.querySelectorAll('.midia[data-fotos]').forEach(function(el){
    const id = el.dataset.fotos;
    if(fotosVistas[id]){ pintarFotos(el, fotosVistas[id]); return }
    if(el.dataset.indo) return;
    el.dataset.indo = '1';
    fetch(DB + '/blog/midia/' + id + '.json')
      .then(function(r){ return r.ok ? r.json() : null })
      .then(function(d){
        const arr = d ? (Array.isArray(d) ? d : Object.keys(d).sort().map(function(k){ return d[k] })) : [];
        fotosVistas[id] = arr; pintarFotos(el, arr);
      })
      .catch(function(){});
  });
}
function pintarFotos(el, arr){
  if(!arr || !arr.length){ el.remove ? el.remove() : (el.innerHTML = '') ; return }
  const html = arr.map(function(src){ return '<img src="' + src + '" alt="" loading="lazy">' }).join('');
  el.innerHTML = arr.length === 2 ? '<div class="duas">' + html + '</div>' : html;
  el.querySelectorAll('img').forEach(function(im){
    im.onclick = function(){
      const l = document.getElementById('lupa');
      l.querySelector('img').src = im.src; l.classList.add('on');
    };
  });
}

function contagem(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const alvo = new Date(PROVA + 'T00:00:00');
  const d = Math.round((alvo - hoje) / 864e5);
  const t = T[idioma];
  if(d > 0){ document.getElementById('cDias').textContent = d;
             document.getElementById('cTxt').innerHTML = t.ctxt }
  else { document.getElementById('cDias').textContent = d === 0 ? '0' : '—';
         document.getElementById('cTxt').innerHTML = d === 0 ? t.hoje : t.passou }
}

function pintar(){
  const t = T[idioma];
  document.documentElement.lang = idioma;
  document.getElementById('hTit').innerHTML = t.tit;
  document.getElementById('hSub').textContent = t.sub;
  document.getElementById('fTxt').textContent = t.rodape;
  document.getElementById('ano').textContent = new Date().getFullYear();
  contagem();

  pintarEvolucao();

  const host = document.getElementById('posts');
  if(!POSTS.length){ host.innerHTML = '<div class="vazio">' + t.vazio + '</div>'; return }

  host.innerHTML = POSTS.map(function(p){
    const tit = (idioma === 'en' ? p.t_en : p.t_pt) || p.t_pt || p.t_en || '';
    const cor = (idioma === 'en' ? p.c_en : p.c_pt) || p.c_pt || p.c_en || '';
    const longo = cor.length > 620;
    const aberto = abertos.has(p.id) || !longo;
    const mostra = aberto ? cor : cor.slice(0, 560).replace(/\s\S*$/,'') + '…';
    const chips = (p.km || p.pace || p.tempo) ? '<div class="resumo">'
      + (p.km    ? '<span>' + esc(p.km) + ' km</span>' : '')
      + (p.pace  ? '<span>' + esc(p.pace) + '/km</span>' : '')
      + (p.tempo ? '<span>' + esc(p.tempo) + '</span>' : '')
      + '</div>' : '';
    return '<article>'
      + '<div class="data">' + dataLonga(p.data) + '</div>'
      + '<h2>' + esc(tit) + '</h2>'
      + chips
      + embutir(p.video)
      + '<div class="midia" data-fotos="' + p.id + '"></div>'
      + '<div class="corpo">' + texto(mostra) + '</div>'
      + (longo ? '<button class="mais" data-id="' + p.id + '">'
                 + (aberto ? t.menos : t.mais) + '</button>' : '')
      + '</article>';
  }).join('');

  carregarFotos();

  host.querySelectorAll('.mais').forEach(function(b){
    b.onclick = function(){
      const i = b.dataset.id;
      abertos.has(i) ? abertos.delete(i) : abertos.add(i);
      pintar();
    };
  });
}

document.querySelectorAll('.idioma button').forEach(function(b){
  b.onclick = function(){
    idioma = b.dataset.l;
    try{ localStorage.setItem('rwg.lang', idioma) }catch(e){}
    document.querySelectorAll('.idioma button').forEach(function(x){
      x.classList.toggle('on', x.dataset.l === idioma);
    });
    pintar();
  };
});
document.querySelectorAll('.idioma button').forEach(function(x){
  x.classList.toggle('on', x.dataset.l === idioma);
});

document.getElementById('lupa').onclick = function(){ this.classList.remove('on') };

pintar();

/* o resumo de treino é público e só tem número: nada de sono,
   estresse, HRV ou onde a corrida passou */
fetch(DB + '/blog/evolucao.json')
  .then(function(r){ return r.ok ? r.json() : null })
  .then(function(d){ if(d && d.meses){ EVO = d; pintarEvolucao() } })
  .catch(function(){});

/* os textos são públicos: leitura direta, sem login */
fetch(DB + '/blog/posts.json')
  .then(function(r){ return r.ok ? r.json() : null })
  .then(function(d){
    if(!d) return;
    POSTS = Object.keys(d).map(function(k){ return Object.assign({id:k}, d[k]) })
      .filter(function(p){ return p.publicado && p.data })
      .sort(function(a,b){ return a.data < b.data ? 1 : -1 });
    pintar();
  })
  .catch(function(){});
</script>
</body>
</html>
